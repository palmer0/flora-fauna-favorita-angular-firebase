<div class="p-4">
  <h2 class="text-2xl font-bold mb-4">{{ getTitulo() }}</h2>
  <div class="space-y-4">

    <div>
      <label class="block text-sm font-medium text-gray-700">Nombre</label>
      <input
        [(ngModel)]="item.nombre"
        class="w-full mt-1 border rounded-md p-2"
      />
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700">Descripción</label>
      <textarea
        [(ngModel)]="item.descripcion"
        class="w-full mt-1 border rounded-md p-2"
      ></textarea>
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700">Imagen</label>
      <input type="file" (change)="onFileSelected($event)" />
    </div>

    <div *ngIf="uploading" class="flex items-center space-x-2 text-sm text-gray-600">
      <span class="animate-spin h-5 w-5 border-2 border-blue-500 border-t-transparent rounded-full"></span>
      <span>Subiendo imagen...</span>
    </div>

    <div *ngIf="item.imagenUrl">
      <img [src]="item.imagenUrl" class="max-w-full mt-2 rounded-md" />
    </div>

    <button (click)="saveItem()" class="w-full bg-blue-600 text-white py-2 rounded-md hover:bg-blue-700">
      Guardar
    </button>
  </div>
</div>
